[project]
name = "switchboard"
version = "0.1.0"
description = "Local-LLM offload core: route cheap judgment calls to a local model, defer to Claude on any failure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
# S310 (urllib audit): every urlopen/Request here targets a config-validated http(s) URL
# (base_url is regex-checked for scheme + path safety in config.py). The audit is for
# file:/custom schemes, which the config validator already forbids.
ignore = ["S310"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; S105 is a false positive on PASS_* constant names;
# S310 fires on the urlopen-stub plumbing.
"tests/*" = ["S101", "S105", "S310"]
# __main__ live smoke: S105 false positive on PASS_PROMPT, S101 sanity assert is fine.
"switchboard/__main__.py" = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
